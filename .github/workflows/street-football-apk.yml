name: Street Football - Android debug APK

on:
  push:
    paths:
      - "street-football/**"
      - ".github/workflows/street-football-apk.yml"
      - ".github/keystore/**"
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  PROJECT_DIR: street-football

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-stable

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl && cd ~/godot-dl
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

      - name: Install Godot, templates and editor settings
        run: |
          cd ~/godot-dl
          unzip -oq "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$TPL_DIR"
          unzip -oq "Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TPL_DIR/"
          mkdir -p ~/.config/godot
          MINOR="${GODOT_VERSION%.*}"
          for f in "editor_settings-${MINOR}.tres" "editor_settings-4.tres"; do
            printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' \
              "$ANDROID_HOME" "$JAVA_HOME" > ~/.config/godot/"$f"
          done
          godot --version

      - name: Import project
        run: godot --headless --path "$PROJECT_DIR" --import 2>&1 | tee import.log

      - name: Physics tests (headless)
        run: |
          godot --headless --path "$PROJECT_DIR" res://tests/physics_smoke_test.tscn --quit-after 2000 2>&1 | tee test.log
          if ! grep -q "TESTS DONE: 0 failure" test.log; then
            echo "::error::Physics tests failed or did not finish (see above)."
            exit 1
          fi

      - name: Player stats tests (headless)
        run: |
          godot --headless --path "$PROJECT_DIR" res://tests/stats_test.tscn --quit-after 3000 2>&1 | tee stats.log
          grep -E "TEST (PASS|FAIL)" stats.log || true
          if ! grep -q "STATS TESTS DONE: 0 failure" stats.log; then
            echo "::error::Player stats tests failed or did not finish (see above)."
            awk '/SCRIPT ERROR|ERROR:/ && !seen[$0]++' stats.log | head -30
            exit 1
          fi

      - name: Menu flow tests (headless)
        run: |
          godot --headless --path "$PROJECT_DIR" res://tests/ui_flow_test.tscn --quit-after 3000 2>&1 | tee ui.log
          grep -E "TEST (PASS|FAIL)" ui.log || true
          if ! grep -q "UI TESTS DONE: 0 failure" ui.log; then
            echo "::error::Menu flow tests failed or did not finish (see above)."
            awk '/SCRIPT ERROR|ERROR:/ && !seen[$0]++' ui.log | head -30
            exit 1
          fi

      - name: AI vs AI match test (headless)
        run: |
          godot --headless --fixed-fps 60 --path "$PROJECT_DIR" res://tests/match_sim_test.tscn --quit-after 90000 2>&1 | tee match_test.log
          grep -E "MATCH RESULT|MATCH BALANCE|TEST (PASS|FAIL)" match_test.log || true
          if ! grep -q "MATCH TESTS DONE: 0 failure" match_test.log; then
            echo "::error::AI match test failed or did not finish (see above)."
            awk '/SCRIPT ERROR|ERROR:/ && !seen[$0]++' match_test.log | head -30
            exit 1
          fi

      - name: Run the scenes briefly and check for script errors
        run: |
          godot --headless --path "$PROJECT_DIR" --quit-after 120 2>&1 | tee run.log
          godot --headless --path "$PROJECT_DIR" res://scenes/match/match.tscn --quit-after 300 2>&1 | tee match.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" import.log test.log stats.log ui.log match_test.log run.log match.log > errors.log; then
            echo "Distinct errors (count, file:message), first ones first:"
            awk '!seen[$0]++' errors.log | head -40
            echo "::error::Godot reported script errors (see above)."
            exit 1
          fi

      - name: Screenshots of every screen (for review, never blocks the build)
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          xvfb-run -a -s "-screen 0 2400x1080x24" godot --path "$PROJECT_DIR" --rendering-driver opengl3 \
            --resolution 2400x1080 res://tests/screenshot_tour.tscn 2>&1 | tee shots.log | grep -v "^SHOT_DATA" || true
          echo "Shots captured: $(grep -c '^SHOT_END' shots.log || true)"

      - name: Export debug APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/.github/keystore/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p "$GITHUB_WORKSPACE/build"
          godot --headless --path "$PROJECT_DIR" --export-debug "Android" "$GITHUB_WORKSPACE/build/street-football-debug.apk" 2>&1 | tee export.log
          test -s "$GITHUB_WORKSPACE/build/street-football-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/build"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: street-football-debug-apk-${{ github.sha }}
          path: build/street-football-debug.apk
          retention-days: 14
