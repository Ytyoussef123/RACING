plugins {
    id 'com.android.application'
}

android {
    namespace 'ma.corniche.rush'
    compileSdk 35

    defaultConfig {
        applicationId 'ma.corniche.rush'
        minSdk 24
        targetSdk 35
        // (set by the build on GitHub: the run number, and the game's version read from game/index.html)
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: 'dev')
    }

    // one fixed key, kept in the repository on purpose (not a secret, like Android's own debug key): every build is
    // signed the same way, so a new APK installs over the previous one and keeps the records saved in the game
    signingConfigs {
        shared {
            storeFile file('corniche.keystore')
            storePassword 'android'
            keyAlias 'corniche'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
        debug {
            signingConfig signingConfigs.shared
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
