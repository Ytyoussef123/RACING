<!doctype html><html><head><meta charset="utf-8"></head><body>
<script src="dl/package/build/three.min.js"></script>
<script>
// per-vertex ambient occlusion from many directional depth maps (the cabin hides most of the sky)
window.bake = async (opts) => {
  const prep = await (await fetch('glb-in/prep.json')).json();
  const renderer = new THREE.WebGLRenderer({ antialias: false }); const SZ = opts.size || 1536;
  renderer.setSize(SZ, SZ, false);
  const rt = new THREE.WebGLRenderTarget(SZ, SZ, { type: THREE.UnsignedByteType });
  const depthMat = new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, side: THREE.DoubleSide });
  const res = {};
  async function run(names, extra, dirsN) {
    const scene = new THREE.Scene(); const verts = [];
    for (const g of names) {
      const G = prep.groups[g], geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(G.pos.flat(), 3)); geo.setIndex(G.idx);
      scene.add(new THREE.Mesh(geo, depthMat)); verts.push([g, G]);
    }
    for (const m of extra) { m.material = depthMat; scene.add(m); }
    const box = new THREE.Box3().setFromObject(scene), ctr = box.getCenter(new THREE.Vector3()), R = box.getSize(new THREE.Vector3()).length() / 2 + 0.05;
    const cam = new THREE.OrthographicCamera(-R, R, R, -R, 0.01, 4 * R);
    const acc = {}, wsum = {}, accL = {}; const span = 4 * R - 0.01, DL = opts.local || 0.22;
    for (const [g, G] of verts) { acc[g] = new Float32Array(G.pos.length); wsum[g] = new Float32Array(G.pos.length); accL[g] = new Float32Array(G.pos.length); }
    const buf = new Uint8Array(SZ * SZ * 4), v = new THREE.Vector3(), UF = [1 / 256 ** 4, 1 / 256 ** 3, 1 / 256 ** 2, 1 / 256];
    const ga = Math.PI * (3 - Math.sqrt(5));
    for (let k = 0; k < dirsN; k++) {
      const y = 1 - (k + 0.5) / dirsN * 2, r = Math.sqrt(1 - y * y), th = ga * k;
      const d = new THREE.Vector3(Math.cos(th) * r, y, Math.sin(th) * r);
      cam.position.copy(ctr).addScaledVector(d, 2 * R); cam.up.set(Math.abs(d.y) > 0.9 ? 1 : 0, Math.abs(d.y) > 0.9 ? 0 : 1, 0); cam.lookAt(ctr); cam.updateMatrixWorld(); cam.updateProjectionMatrix();
      renderer.setRenderTarget(rt); renderer.setClearColor(0xffffff, 1); renderer.clear(); renderer.render(scene, cam);
      renderer.readRenderTargetPixels(rt, 0, 0, SZ, SZ, buf);
      if (k === 0 && opts.debug) { let nw = 0, mn = 1e9; for (let q = 0; q < buf.length; q += 4) { const ds = buf[q] * UF[0] + buf[q + 1] * UF[1] + buf[q + 2] * UF[2] + buf[q + 3] * UF[3]; if (buf[q] !== 255 || buf[q + 3] !== 255) nw++; mn = Math.min(mn, ds); } console.log('dir0', d.toArray().map(x => x.toFixed(2)).join(','), 'nonwhite', nw, 'mindepth', mn.toFixed(4), 'R', R.toFixed(3), 'ctr', ctr.toArray().map(x => x.toFixed(2)).join(','), 'gl', renderer.getContext().getError(), 'sample', Array.from(buf.slice((SZ * SZ / 2 + SZ / 2) * 4, (SZ * SZ / 2 + SZ / 2) * 4 + 4)).join(',')); }
      for (const [g, G] of verts) {
        const A = acc[g], W = wsum[g], AL = accL[g];
        for (let i = 0; i < G.pos.length; i++) {
          const n = G.nor[i], w = n[0] * d.x + n[1] * d.y + n[2] * d.z;
          const p = G.pos[i];
          // two-sided: a vertex whose normal faces away still gets light on its other side, but we only count the side the normal shows
          if (w <= 0) continue;
          W[i] += w;
          v.set(p[0] + n[0] * 0.004, p[1] + n[1] * 0.004, p[2] + n[2] * 0.004).project(cam);
          const px = Math.floor((v.x * 0.5 + 0.5) * SZ), py = Math.floor((v.y * 0.5 + 0.5) * SZ);
          if (px < 0 || py < 0 || px >= SZ || py >= SZ) { A[i] += w; AL[i] += w; continue; }
          // nearest occluder in front of the vertex toward the light (best of a 3x3 neighbourhood)
          let gap = 1e9; const vz = v.z * 0.5 + 0.5;
          for (let oy = -1; oy <= 1; oy++) for (let ox = -1; ox <= 1; ox++) {
            const qx = Math.min(SZ - 1, Math.max(0, px + ox)), qy = Math.min(SZ - 1, Math.max(0, py + oy)), o = (qy * SZ + qx) * 4;
            const ds = buf[o] * UF[0] + buf[o + 1] * UF[1] + buf[o + 2] * UF[2] + buf[o + 3] * UF[3];
            gap = Math.min(gap, (vz - ds) * span);
          }
          if (gap <= 0.004) { A[i] += w; AL[i] += w; }            // nothing in the way
          else if (gap > DL) AL[i] += w;                           // blocked, but only by something far away
        }
      }
    }
    for (const [g, G] of verts) { const A = acc[g], W = wsum[g], AL = accL[g]; res[g] = { glob: Array.from(A, (a, i) => Math.round(255 * (W[i] > 0 ? a / W[i] : 1))), loc: Array.from(AL, (a, i) => Math.round(255 * (W[i] > 0 ? a / W[i] : 1))) }; }
  }
  const b = prep.bounds;
  const roof = new THREE.Mesh(new THREE.BoxGeometry(b[1][0] - b[0][0] + 0.1, 0.04, b[1][2] + 0.34));
  roof.position.set((b[0][0] + b[1][0]) / 2, b[1][1] + 0.005, (b[1][2] - 0.34) / 2 + 0.0); roof.updateMatrixWorld();
  const cabin = Object.keys(prep.groups).filter((g) => !prep.groups[g].wheel);
  await run(cabin, [roof], opts.dirs || 160);
  await run(['wheelRim', 'wheelHub'], [], opts.wdirs || 96);
  return res;
};
</script></body></html>
