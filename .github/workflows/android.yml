# The Android app (android/): built on GitHub with Google's own Android tools, at every change to the game or to the
# app, and published as a release: https://github.com/<owner>/<repo>/releases/latest (CornicheRush.apk).
name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['game/**', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: The game, for the app (offline)
        run: python3 android/prepare_assets.py . android/app/src/main/assets

      - name: Version
        run: |
          v=$(grep -o 'Corniche Rush V[0-9]\+' game/index.html | head -1 | grep -o 'V[0-9]\+')
          echo "VERSION_NAME=${v:-dev}" >> "$GITHUB_ENV"
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Check the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" verify --verbose "$apk" | head -8
          "$bt/aapt2" dump badging "$apk" | grep -E "^package|sdkVersion|launchable" || true
          mkdir -p out && cp "$apk" "out/CornicheRush-$VERSION_NAME.apk" && cp "$apk" out/CornicheRush.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: CornicheRush-${{ env.VERSION_NAME }}-apk
          path: out/CornicheRush-${{ env.VERSION_NAME }}.apk

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="android-$VERSION_NAME-${{ github.run_number }}"
          gh release create "$tag" out/CornicheRush.apk "out/CornicheRush-$VERSION_NAME.apk" \
            --target "${{ github.sha }}" --latest \
            --title "Corniche Rush $VERSION_NAME (Android)" \
            --notes "Application Android du jeu, $VERSION_NAME, jouable sans connexion. Sur le téléphone : télécharger CornicheRush.apk, l'ouvrir, autoriser l'installation depuis cette source si Android le demande. Une nouvelle version s'installe par-dessus l'ancienne et garde les records."
